    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three voices, deliberately.
        Chakra Petch — angular and technical, for the machine's own readouts.
        Spectral     — a literary serif for the NARRATIVE. The prose is a human
                       describing what they see; it should not share a typeface
                       with the instrument panel around it.
        JetBrains Mono — chrome labels, with real tabular numerals so the year
                       does not jitter while you scrub.
      Weights are pinned tight; this is a full-bleed image app and fonts must not
      be what the visitor waits for.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap"
    />

  </head>

  </body>
